<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FB Prompt Builder</title>
<style>
:root{--bg:#0f1320;--card:#181e30;--line:#2a3350;--tx:#eef1f8;--mu:#97a1bd;--ac:#f2c14e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Roboto,'Segoe UI',Arial,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
button{cursor:pointer}
button.p{background:var(--ac);color:#1a1a1a;border-color:var(--ac);font-weight:600}
button.rs{color:#ff8a7a;border-color:#ff8a7a;font-weight:600;padding:6px 18px}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:15px;margin:0 0 4px}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 4px}
input,select,textarea{width:100%}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
small{color:var(--mu);display:block;margin-top:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><h1>FB Prompt Builder</h1><button id="rst" class="rs">Reset</button></header>
<main>
 <div class="card"><h2>Build your prompt</h2>
  <div class="row"><div><label for="niche">Page niche</label><input id="niche" value="psychology, relationships and dating" autocomplete="off"></div><div><label for="goal">Goal of the post</label><select id="goal" autocomplete="off"><option value="comments">More comments</option><option value="shares">More shares</option><option value="saves">More saves</option></select></div></div>
  <label for="topic">Own topic (use this when you have no reference)</label><input id="topic" placeholder="e.g. why we overthink after a first date" autocomplete="off">
  <label for="ref">Reference text (optional)</label><textarea id="ref" style="min-height:130px" placeholder="Paste text from a Pinterest pin or a Facebook post" autocomplete="off"></textarea>
  <label for="out">Ready prompt</label><textarea id="out" readonly autocomplete="off" style="min-height:260px"></textarea>
  <button class="p" id="cpp" style="margin-top:8px;width:100%">Copy prompt</button>
  <small>Paste the prompt into Claude, ChatGPT or Gemini, then copy each code block into FB Post Studio. Nothing is saved on this page: tap Reset (top right) or reload to clear everything.</small></div>
</main>
<script>
const $=id=>document.getElementById(id);
function copy(t){if(navigator.clipboard)return navigator.clipboard.writeText(t).catch(()=>fb(t));fb(t)}
function fb(t){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove()}
const F='```';
const GOAL={comments:'comments (the CTA and caption must make people want to answer)',shares:'shares (make it so relatable that people send it to a friend or partner)',saves:'saves (give a checklist, rule or script people want to keep)'};
const PROMPT=()=>`You are a content strategist for a professional Facebook page about ${$('niche').value.trim()||'psychology, relationships and dating'}. Audience: English-speaking adults 18-35.
MAIN GOAL: every post must earn ${GOAL[$('goal').value]||GOAL.comments}. Facebook rewards original posts that spark real comments, shares and saves.

I will paste text taken from a Pinterest pin or a Facebook post as REFERENCE.

STEP 1 - Extract only:
- The core topic
- The underlying psychological idea
- Why people would relate to it
Do NOT reuse its wording, structure, examples or order.

STEP 2 - Create 3 ORIGINAL post options on that topic, each in a different format. Choose from: Short statement, Signs list, Myth vs fact, Say this, not that, Psychology term, Question / poll.

RULES for every post:
- Headline: max 10 words, a scroll-stopping hook (curiosity, contrast, or a truth people feel but rarely say)
- Body: max 35 words, simple English, no jargon
- Must give one useful insight or action, not just emotion
- Tone: calm, wise, supportive, never preachy or dramatic
- No emojis inside the image text
- Add a short CTA (Save this / Share with someone / Comment A or B)
- Do not use the same sentence patterns as the reference

STEP 3 - For each option also write a Facebook caption (first line = hook, then 2-3 short lines, ending with a question) and 3 relevant hashtags.

OUTPUT FORMAT - follow it exactly, because I will copy each code block separately into an app:
Core idea: <one line>

Then, for each of the 3 options:
Option 1
Template: <exactly one of: Short statement / Signs list / Myth vs fact / Say this, not that / Psychology term / Question / poll>
Headline:
${F}
<headline text only>
${F}
Body:
${F}
<body text only>
${F}
CTA:
${F}
<cta text only>
${F}
Caption + hashtags:
${F}
<caption text>

<3 hashtags>
${F}

CODE BLOCK RULES:
- Inside each code block put only the final text: no labels, no quotes, no bullets, no numbers, no dashes at the start of lines.
- Headline: wrap 1-3 key words in *single stars* for highlighting. Never use ** bold.
- Signs list: Body = 4-5 lines, one point per line, max 8 words each.
- Question / poll: Body = exactly 2 lines, option A then option B, without A) or B) letters.
- Myth vs fact: Headline = the myth, Body = the fact.
- Say this, not that: Headline = what NOT to say, Body = what to say instead.
- Psychology term: Headline = the term, Body = its simple meaning.
- Short statement: Headline = the statement, Body = 1-2 supporting sentences.
- Add nothing outside this format: no extra explanations, no visual directions.

REFERENCE TEXT:
`;
function mkOut(){const r=$('ref').value.trim(),t=$('topic').value.trim();$('out').value=PROMPT()+(r?r+(t?'\n\nExtra angle: '+t:''):'(No reference given. Write the posts from this topic: '+(t||'a fresh, relatable idea for this niche')+')')}
['ref','niche','goal','topic'].forEach(k=>$(k).addEventListener('input',mkOut));
$('cpp').onclick=()=>{copy($('out').value);$('cpp').textContent='Copied';setTimeout(()=>$('cpp').textContent='Copy prompt',1200)};
$('rst').onclick=()=>{$('ref').value='';$('topic').value='';$('niche').value='psychology, relationships and dating';$('goal').value='comments';mkOut();$('rst').textContent='Cleared';setTimeout(()=>$('rst').textContent='Reset',1200);scrollTo(0,0)};
mkOut();
</script></body></html>
